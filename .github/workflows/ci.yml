name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub's hosted runners have no GPU, so the test suite and the benchmarks
# cannot run here -- every one of them needs a real device. What CI can do is
# prove the package still parses, formats, documents and builds. The tests are
# run on a machine with a GPU before anything is pushed; `pixi run test` is the
# command, and it needs about a second.
jobs:
  test-bits:
    name: bit mapping (no GPU needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      # The only suite that runs without a device. It pins the exact bit
      # patterns the order-preserving mapping must produce, which is what
      # stops this package's copy of `_bits.mojo` drifting from the CPU
      # package's original.
      - name: Run the bit-mapping tests
        run: pixi run test-bits

  lint:
    name: format and docstrings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Check formatting
        run: |
          pixi run format
          git diff --exit-code

      - name: Check docstrings
        run: pixi run docs

  build:
    name: build package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # The pixi-build-mojo backend speaks pixi-build-api-version 7, which
          # needs pixi >= 0.80. An older pixi does not fail on the version --
          # it silently falls back to a 2025 backend that calls the removed
          # `mojo package -o *.mojopkg`.
          pixi-version: v0.80.0
          cache: true

      - name: Build the conda package
        run: pixi build

      - name: Check a package was produced
        shell: bash
        run: |
          shopt -s nullglob
          pkgs=(./*.conda)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "pixi build produced no .conda package" >&2
            exit 1
          fi
          ls -lh "${pkgs[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: mm_radix_sort_gpu-${{ matrix.os }}
          path: ./*.conda
          if-no-files-found: error
